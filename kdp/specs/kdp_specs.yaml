# Amazon KDP constants: the single source of truth for this project.
#
# Nothing else in the codebase may hardcode a KDP number. Every value below
# cites the mirrored help topic it came from, and tests/test_specs_match_wiki.py
# asserts each one still appears in that topic - so refreshing the mirror fails
# loudly if Amazon changes a specification, rather than silently shipping a book
# that gets rejected.
#
# Large tables (trim sizes, page-count ranges, margins) are too big to hand-copy
# safely; they live in trim_sizes.json, generated by kdp/wiki/specs.py.

units: inches

# --- Interior ------------------------------------------------------------
interior:
  # topics/set-trim-size-bleed-and-margins.md
  # Pages are trimmed 0.125" from top, bottom and outside edge. A bleed page is
  # therefore WIDER by one bleed (outside only - the gutter edge is not cut) and
  # TALLER by two (top and bottom). Verified against all 29 worked examples KDP
  # publishes; see tests/test_geometry.py::test_bleed_matches_kdp_examples.
  bleed: 0.125
  bleed_added_to_width: 0.125
  bleed_added_to_height: 0.25

  min_font_pt: 7          # topics/paperback-fonts.md

# --- Spine ---------------------------------------------------------------
# Spine width = page count x factor, by paper stock.
spine_factors_per_page:
  white: 0.002252         # topics/create-a-paperback-cover.md
  cream: 0.0025           # topics/create-a-paperback-cover.md
  groundwood: 0.00235     # topics/paperback-submission-guidelines.md
  premium_color: 0.002347 # topics/create-a-paperback-cover.md
  standard_color: 0.002252 # topics/create-a-paperback-cover.md

# --- Paperback cover -----------------------------------------------------
paperback_cover:
  # topics/create-a-paperback-cover.md
  #   Cover Width  = Bleed + Back + Spine + Front + Bleed
  #   Cover Height = Bleed + Trim Height + Bleed
  bleed: 0.125
  spine_text_min_pages: 79   # spine text is rejected below this
  spine_text_clearance: 0.0625
  fold_variance: 0.0625

# --- Hardcover cover -----------------------------------------------------
hardcover_cover:
  # topics/create-a-hardcover-cover.md
  wrap: 0.51                 # extends past the trim, glued inside the case
  hinge: 0.4                 # flex gap between spine and safe area
  headband_min_pages: 120
  barcode_width: 2.0
  barcode_height: 1.2
  barcode_min_from_bottom: 0.76
  barcode_min_from_hinge: 0.25

# --- File requirements ---------------------------------------------------
file:
  # topics/paperback-submission-guidelines.md
  max_size_mb: 650
  min_image_dpi: 300
